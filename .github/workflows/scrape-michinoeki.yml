# ============================================================
# Workflow GitHub Actions — scraping hebdomadaire des stations Michi no Eki
#
# Ce fichier doit être placé dans le dépôt Evasionsrebelles/michinoEki,
# à l'emplacement exact :
#   .github/workflows/scrape-michinoeki.yml
#
# Le script 01-scrape_michinoeki.py doit lui aussi être présent à la
# racine de ce même dépôt (il n'a besoin d'aucun jeton ni d'aucune
# modification : il écrit simplement michinoeki.json et update_date.txt
# dans le dossier courant — c'est ce workflow qui se charge de committer
# et pousser ces deux fichiers, contrairement au scraper du calendrier
# Japon qui les publiait lui-même via l'API GitHub).
#
# Ce que fait ce workflow :
# 1. Se déclenche automatiquement chaque lundi à 10h00, heure du Japon
#    (JST, UTC+9), ou manuellement depuis l'onglet "Actions" de GitHub.
#    GitHub n'exécute les cron qu'en UTC. Le Japon n'ayant pas d'heure
#    d'été (décalage fixe de +9h toute l'année), un seul cron suffit :
#    10h00 JST = 01h00 UTC le même lundi. Aucune garde horaire n'est
#    nécessaire. Note : GitHub peut retarder l'exécution des cron
#    planifiés (parfois de plusieurs heures aux heures de charge),
#    ce qui est sans conséquence ici puisque rien ne dépend de l'heure
#    réelle de lancement.
# 2. Installe Python sur une machine virtuelle temporaire.
# 3. Installe les dépendances du scraper (requests, beautifulsoup4).
# 4. Exécute 01-scrape_michinoeki.py, qui régénère localement
#    michinoeki.json et update_date.txt.
# 5. Archive l'ancienne version : si le nouveau michinoeki.json diffère
#    de celui de main, l'ancien est copié sous michinoeki_DD_MM_YY.json
#    (date de l'ancienne version, lue dans l'ancien update_date.txt).
#    Seules les 5 archives les plus récentes sont conservées : les plus
#    anciennes sont supprimées (tri par année, puis mois, puis jour).
# 6. Committe et pousse michinoeki.json, update_date.txt et les archives
#    (ajout et suppression) sur main s'ils ont changé,
#    en utilisant le jeton intégré GITHUB_TOKEN (le workflow vit dans
#    le même dépôt que les fichiers à mettre à jour, donc pas besoin
#    d'un Personal Access Token séparé — sauf si la branche main est
#    protégée par des règles qui excluent le jeton par défaut).
# 7. Envoie un mail de statut (succès ou échec) via Gmail SMTP, quel
#    que soit le résultat des étapes précédentes.
#
# Fichiers remplacés par ce workflow :
#   https://github.com/Evasionsrebelles/michinoEki/blob/main/michinoeki.json
#   https://github.com/Evasionsrebelles/michinoEki/blob/main/update_date.txt
#
# Secrets GitHub Actions requis pour le mail :
#   MAIL_USERNAME : adresse Gmail complète (ex: toncompte@gmail.com)
#   MAIL_PASSWORD : mot de passe d'application Gmail (16 caractères,
#                   généré sur myaccount.google.com/apppasswords)
#   MAIL_TO       : adresse qui recevra la notification de statut
# ============================================================

name: Scraping hebdomadaire Michi no Eki

on:
  # Déclenchement manuel : un bouton "Run workflow" apparaît
  # dans l'onglet Actions du dépôt GitHub. Il s'exécute immédiatement,
  # quelle que soit l'heure.
  workflow_dispatch:

  # Déclenchement planifié (syntaxe cron, toujours en UTC côté GitHub).
  # Lundi 10h00 JST (UTC+9, sans heure d'été) = lundi 01h00 UTC.
  schedule:
    - cron: '0 1 * * 1'   # lundi 10h00 heure du Japon (JST)

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Nécessaire pour que GITHUB_TOKEN puisse pousser le commit sur main.
    permissions:
      contents: write

    steps:
      # Étape 1 : récupère le code du dépôt sur la machine virtuelle
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      # Étape 2 : installe Python
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Étape 3 : installe les dépendances du scraper
      - name: Installation des dépendances
        run: pip install requests beautifulsoup4

      # Étape 4 : lance le scraper, qui régénère localement
      # michinoeki.json et update_date.txt à la racine du dépôt.
      - name: Exécution du scraper
        id: scrape
        run: python3 01-scrape_michinoeki.py

      # Étape 5 : archive l'ancienne version (celle de main) sous
      # michinoeki_DD_MM_YY.json, puis ne garde que les 5 archives
      # les plus récentes.
      - name: Archivage de l'ancienne version
        id: archive
        if: steps.scrape.outcome == 'success'
        run: |
          # Première exécution : aucune ancienne version à archiver.
          if ! git cat-file -e HEAD:michinoeki.json 2>/dev/null; then
            echo "Pas d'ancienne version dans le dépôt : rien à archiver."
            exit 0
          fi
          git show HEAD:michinoeki.json > /tmp/old_michinoeki.json

          # Contenu identique : pas d'archive (sinon des doublons feraient
          # sortir de vraies anciennes versions de la fenêtre des 5).
          if cmp -s /tmp/old_michinoeki.json michinoeki.json; then
            echo "Données identiques à la version actuelle : pas d'archive."
            exit 0
          fi

          # Date de l'ancienne version, lue dans l'ancien update_date.txt
          # (format attendu : DD/MM/YYYY HH:MM). À défaut, date du jour (UTC).
          old_date=$(git show HEAD:update_date.txt 2>/dev/null \
            | grep -oE '[0-9]{2}/[0-9]{2}/[0-9]{4}' | head -n 1 || true)
          if [ -n "$old_date" ]; then
            dd="${old_date:0:2}"; mm="${old_date:3:2}"; yy="${old_date:8:2}"
          else
            dd=$(date -u +'%d'); mm=$(date -u +'%m'); yy=$(date -u +'%y')
            echo "update_date.txt illisible : date du jour utilisée."
          fi
          archive="michinoeki_${dd}_${mm}_${yy}.json"
          cp /tmp/old_michinoeki.json "$archive"
          echo "Ancienne version archivée : $archive"

          # Rotation : tri chronologique (YYMMDD), on supprime tout sauf
          # les 5 plus récentes.
          ls -1 michinoeki_[0-9][0-9]_[0-9][0-9]_[0-9][0-9].json 2>/dev/null \
            | sed -E 's/^michinoeki_([0-9]{2})_([0-9]{2})_([0-9]{2})\.json$/\3\2\1 &/' \
            | sort \
            | head -n -5 \
            | cut -d' ' -f2- \
            | xargs -r rm -v

      # Étape 6 : committe et pousse les fichiers de sortie sur main,
      # uniquement si le scraping a réussi et qu'ils ont réellement changé.
      - name: Commit et push des données mises à jour
        id: commit
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add michinoeki.json update_date.txt
          # -A : prend aussi en compte les archives supprimées par la rotation.
          git add -A -- 'michinoeki_*.json'
          if git diff --cached --quiet; then
            echo "Aucun changement détecté, rien à committer."
          else
            git commit -m "Mise à jour automatique des données Michi no Eki ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      # Étape 7 : envoie un mail de statut, que le scraping ait réussi
      # ou échoué (if: always() = s'exécute quel que soit le résultat
      # des étapes précédentes).
      - name: Envoi du mail de statut
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            [Michi no Eki] Scraping
            ${{ steps.scrape.outcome == 'success' && 'réussi ✅' || 'échoué ❌' }}
            (${{ github.run_id }})
          to: ${{ secrets.MAIL_TO }}
          from: Michi no Eki - GitHub Actions
          body: |
            Résultat de l'exécution : ${{ steps.scrape.outcome }}

            Dépôt : ${{ github.repository }}
            Workflow : ${{ github.workflow }}
            Déclenché par : ${{ github.event_name }}

            Fichiers mis à jour :
            https://github.com/${{ github.repository }}/blob/main/michinoeki.json
            https://github.com/${{ github.repository }}/blob/main/update_date.txt

            Détails complets du run :
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
